



base_model: openai/gpt-oss-20b
use_kernels: false
model_quantization_config: Mxfp4Config
model_quantization_config_kwargs:
  dequantize: true

experimental_skip_move_to_device: true  # prevent OOM by NOT putting model to GPU before sharding

datasets:
  #- path: HuggingFaceH4/Multilingual-Thinking
  # type: chat_template
  # field_thinking: thinking
  # template_thinking_key: thinking
  - path: /lustre/home/mzupan/axolotl/data/deepseek_r1_optimized-improved.jsonl #this is my local dataset; in that case, you need to change field_messages: messages
    type: chat_template
    chat_template: tokenizer_default
    field_messages: messages #conversations
    message_property_mappings:
       role: role ###type #role is for tabular dataset and 'type' is set in accounting_data.jsonl
       content: content
    roles_to_train: ["assistant"]
    train_on_eos: turn
  #this is the second dataset with journal accounts' codes
  - path: mariozupan/rrif
    split: train
    type: chat_template
    chat_template: tokenizer_default
    field_messages: conversations
    message_property_mappings:
      role: role
      content: content
    roles_to_train: ["assistant"]
    train_on_eos: turn
  #this is the third dataset with journal codenames, but different kind of quest on the same subject, masked description
  - path: mariozupan/bookkeeping-posting-schemes-2007-2023
    split: train
    type: chat_template
    chat_template: tokenizer_default
    field_messages: conversations
    message_property_mappings:
      role: role
      content: content
    roles_to_train: ["assistant"]
    train_on_eos: turn



dataset_prepared_path: ./outputs/last_run_prepared
val_set_size: 0.1
output_dir: ./outputs-wiley/gpt-oss-20b-fft-2epoch/

sequence_len: 4096
sample_packing: true

wandb_project: axlotl
wandb_entity: mariozupansystems-srce
wandb_watch:
wandb_name:
wandb_log_model:

gradient_accumulation_steps: 4
micro_batch_size: 1
num_epochs: 2

optimizer: adamw_torch_8bit
lr_scheduler: cosine #constant_with_warmup
learning_rate: 1e-5

bf16: true
tf32: true

flash_attention: true

gradient_checkpointing: true
activation_offloading: true



#eval loss every 50 steps
evaluation_strategy: steps
evals_per_epoch: 30   # fallback

##train loss every 10 steps
logging_steps: 10

#prevent early weight shock.
warmup_ratio: 0.05 #0.03

special_tokens:
eot_tokens:
  - "<|end|>"

fsdp_version: 2
fsdp_config:
  offload_params: false
  state_dict_type: SHARDED_STATE_DICT
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap: GptOssDecoderLayer
  reshard_after_forward: true
#  cpu_ram_efficient_loading: true

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
  - axolotl.integrations.liger.LigerPlugin
liger_rope: true
liger_rms_norm: true
liger_glu_activation: true
liger_layer_norm: true
liger_fused_linear_cross_entropy: true
