base_model: zai-org/GLM-4.5-Air

# Automatically upload checkpoint and final model to HF
# hub_model_id: username/custom_model_name

plugins:
    - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

load_in_8bit: false
load_in_4bit: true

quantize_moe_experts: true # important

datasets:
  #- path: HuggingFaceH4/Multilingual-Thinking
  # type: chat_template
  # field_thinking: thinking
  # template_thinking_key: thinking
  - path: /lustre/home/mzupan/axolotl/data/deepseek_r1_optimized-improved.jsonl #this is my local dataset; in that case, you need to change field_messages: messages
    type: chat_template
    chat_template: tokenizer_default
    field_messages: messages #conversations
    message_property_mappings:
       role: role ###type #role is for tabular dataset and 'type' is set in accounting_data.jsonl
       content: content
    roles_to_train: ["assistant"]
    train_on_eos: turn
  #this is the second dataset with journal accounts' codes
  - path: mariozupan/rrif
    split: train
    type: chat_template
    chat_template: tokenizer_default
    field_messages: conversations
    message_property_mappings:
      role: role
      content: content
    roles_to_train: ["assistant"]
    train_on_eos: turn
  #this is the third dataset with journal codenames, but different kind of quest on the same subject, masked description
  - path: mariozupan/bookkeeping-posting-schemes-2007-2023
    split: train
    type: chat_template
    chat_template: tokenizer_default
    field_messages: conversations
    message_property_mappings:
      role: role
      content: content
    roles_to_train: ["assistant"]
    train_on_eos: turn




dataset_prepared_path: last_run_prepared
val_set_size: 0.1
output_dir: ./outputs-wiley/GLM-4-5-Air-qlora/

adapter: qlora
lora_model_dir:

sequence_len: 2048
sample_packing: true

wandb_project: axlotl
wandb_entity: mariozupansystems-srce
wandb_watch:
wandb_name:
wandb_log_model:

lora_r: 16
lora_alpha: 8
lora_dropout: 0
lora_target_modules:
    - q_proj
    - v_proj
    - k_proj
    - o_proj

#lora_target_parameters:
#    - mlp.experts.gate_up_proj
#    - mlp.experts.down_proj
#
lora_mlp_kernel: false
lora_qkv_kernel: false
lora_o_kernel: false

gradient_accumulation_steps: 2
micro_batch_size: 2
num_epochs: 1
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 0.0002

bf16: auto
tf32: false

gradient_checkpointing: true
resume_from_checkpoint:
logging_steps: 1
flash_attention: false

warmup_ratio: 0.1
evals_per_epoch: 1
saves_per_epoch: 1

# to avoid:
# axolotl.prompt_strategies.chat_template] EOS token '<|endoftext|>' not found in chat_template. Please check if your template/EOS token is correct.
special_tokens:
  eos_token: "<|endoftext|>"


# save_first_step: true  # uncomment this to validate checkpoint saving works with your config
