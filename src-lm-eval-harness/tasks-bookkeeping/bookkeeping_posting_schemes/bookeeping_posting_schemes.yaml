
tag:
  - bookkeeping
  - accounting
  - structured_output

task: bookkeeping_posting_schemes_validity
dataset_path: mariozupan/bookkeeping-posting-schemes-2007-2023
dataset_name: default

output_type: generate_until
training_split: train
test_split: test
fewshot_split: train

process_docs: !function utils.process_docs

doc_to_text: "{{prompt}}\n\nReturn ONLY a single JSON object (no markdown, no code fences). Required keys: year, document, total_debit, total_credit, entries."
doc_to_target: "{{target}}"

process_results: !function utils.process_results

generation_kwargs:
  do_sample: false
  temperature: 0.0
  max_gen_toks: 512
  until:
    - "<|im_end|>"
    - "<|end|>"
    - "</s>"
    - "<|return|>"

num_fewshot: 0
repeats: 1

metric_list:
  - metric: parsed
    aggregation: mean
    higher_is_better: true
  - metric: balanced
    aggregation: mean
    higher_is_better: true
  - metric: accounts_correct
    aggregation: mean
    higher_is_better: true
  - metric: accounts_score
    aggregation: mean
    higher_is_better: true
  - metric: balanced_and_score
    aggregation: mean
    higher_is_better: true
  - metric: balanced_and_accounts
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.1








